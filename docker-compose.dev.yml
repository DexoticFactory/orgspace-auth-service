services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orgspace_auth
      POSTGRES_USER: orgspace_auth
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgspace_auth -d orgspace_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - auth_nats_data:/data

volumes:
  auth_pg_data:
  auth_redis_data:
  auth_nats_data:
